id: domicile_certificate
version: "2026.08"

name:
  en: "Age, Nationality and Domicile Certificate"
  hi: "अधिवास प्रमाण पत्र"
  mr: "रहिवासी प्रमाणपत्र"

description:
  en: "Certificate proving continuous residency in Maharashtra state for 15+ years."
  hi: "महाराष्ट्र राज्य में 15+ वर्षों का अधिवास प्रमाण पत्र।"
  mr: "महाराष्ट्र राज्यात १५+ वर्षांचा रहिवास दाखला."

issuing_authority:
  primary: "Tahsildar"
  first_appeal: "Sub-Divisional Officer"
  second_appeal: "Additional Collector"

fee:
  amount: 50.0
  currency: "INR"

processing_days: 15

required_fields:
  - field: full_name
    label_en: "Full Name (as on Aadhaar)"
    required: true
    type: text

  - field: date_of_birth
    label_en: "Date of Birth"
    required: true
    type: date

  - field: district
    label_en: "District"
    required: true
    type: text

  - field: years_of_residence
    label_en: "Years of Residence in Maharashtra"
    required: true
    type: number

  - field: certificate_purpose
    label_en: "Purpose of Certificate"
    required: true
    type: text

required_document_groups:
  identity:
    selection_rule: ANY_ONE
    documents:
      - aadhaar_card
      - voter_id
      - passport

  residence_proof:
    selection_rule: ANY_ONE
    documents:
      - school_leaving_certificate
      - ration_card
      - electricity_bill
      - 15_year_domicile_affidavit

eligibility_rules:
  - rule: minimum_15_years_residence
    description: "Must be a resident of Maharashtra for at least 15 years."
    field: years_of_residence
    condition: gte
    value: 15
    error_message:
      en: "Minimum 15 years of continuous residence in Maharashtra is required for Domicile Certificate."
      hi: "डोमिसाइल प्रमाण पत्र के लिए महाराष्ट्र में न्यूनतम 15 वर्ष का निवास आवश्यक है।"
      mr: "डोमिसिल प्रमाणपत्रासाठी महाराष्ट्रात किमान १५ वर्षांचा रहिवास आवश्यक आहे."
